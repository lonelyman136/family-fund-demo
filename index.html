.top h1{margin:0;font-size:22px;font-weight:800;line-height:1.4}.tag{font-size:13px;opacity:.8}

.wrap{margin:16px 244px 40px 16px;max-width:1040px}

.nav button:hover{background:var(--accent-soft)}.nav button.active{background:var(--accent);color:#fff}
button,select,input{font:inherit}
button{cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;transition:.15s}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

.sub{color:var(--muted);font-size:14px;font-weight:600}.stat{font-size:22px;font-weight:800;line-height:1.5;overflow-wrap:anywhere}
.fee-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gold-soft);border-color:var(--gold-b);margin-bottom:14px}.fee-card .stat{color:var(--goldink)}
.personal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.personal-head h2{font-size:24px;margin:0}.personal-head h2:before{display:none}.personal-date{display:none}
.personal-month{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600;flex-wrap:wrap}
.picker-label{display:block;font-weight:700;margin-bottom:10px}.picker-row,.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.picker-row select{flex:1;min-width:160px}.controls{margin-bottom:14px}
.hero-grid{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:14px}
.personal-summary{background:linear-gradient(135deg,var(--navy),#17608a);color:#fff;border-radius:20px;padding:22px}.personal-summary .big{font-size:32px;font-weight:800;line-height:1.5}
.next-card{position:relative;background:var(--gold-soft);border:1px solid var(--gold-b);border-radius:20px;padding:22px}.next-card.now{background:var(--ok-soft);border-color:var(--ok)}
.next-card .k{color:var(--goldink);font-size:14px;font-weight:700}.next-card .v{font-size:24px;font-weight:800}.next-card .s{color:var(--muted);font-size:14px}
.next-card .chip{position:absolute;top:18px;inset-inline-end:18px;background:var(--gold);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700}.next-card.now .chip{background:var(--ok)}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:right}td,th{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--soft);color:var(--muted);font-size:14px}tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--soft)}.personal-table td,.personal-table th{white-space:normal}
.positive{color:var(--ok);font-weight:700}.warn{color:var(--warn);font-weight:700}.loan-red{color:var(--bad);font-weight:700}.muted{color:var(--muted)}.small{font-size:13px}.hide{display:none!important}.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px}
.status-list{display:grid;gap:8px}.status-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:14px}
.status-pill{border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap;display:inline-block;width:fit-content;max-width:100%}.status-pill.repay{background:var(--accent-soft);color:var(--accent)}.status-pill.wait{background:var(--warn-soft);color:var(--warn)}.status-pill.new{background:var(--ok-soft);color:var(--ok)}
.prog{margin-bottom:14px}.prog .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(to left,#ef8a7d,#f2c46b 50%,#5bbf8e) right/100% 100% no-repeat;border-radius:9px}
.queue{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.pill{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;background:var(--soft);border:1px solid var(--line);border-radius:99px}.pill b{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
h3{margin:0 0 10px;font-size:15px;color:var(--muted)}#queue .tablewrap{display:none}
.timeline{max-width:560px}.tl{display:flex;gap:14px;position:relative;padding-bottom:16px}.tl:before{content:'';position:absolute;inset-inline-start:8px;top:22px;bottom:-4px;width:2px;background:var(--line)}.tl:last-child:before{display:none}
.dot{flex:0 0 18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--line);margin-top:5px;z-index:1}.tl.past .dot{background:var(--ok);border-color:var(--ok)}.tl.now .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
.tl-m{font-size:13px;color:var(--muted)}.tl-m em{font-style:normal;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:0 8px;font-size:11px;margin-inline-start:6px}.tl-n{font-weight:800}.tl-a{color:var(--accent);font-size:14px}.tl.now .tl-n{color:var(--goldink)}
.chart{width:100%;height:auto}.gl{stroke:var(--line)}.ax{fill:var(--muted);font-size:var(--fs,10px);font-family:inherit}.sel{stroke:var(--muted);stroke-width:1.5}.chart{touch-action:pan-y}.chart-info{margin:10px 0;line-height:1.9;font-size:15px;background:var(--soft);border-radius:12px;padding:10px 14px}.chart-info em{font-style:normal;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:0 8px;font-size:11px}.fc{fill:var(--soft)}.ar{fill:var(--accent);opacity:.14}.lc{fill:none;stroke:var(--accent);stroke-width:var(--sw,2.5px)}.ld{fill:none;stroke:var(--bad);stroke-width:var(--sw,2.5px)}.cur{stroke:var(--gold);stroke-dasharray:4 4}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:6px}
#loans tbody tr:hover td{background:none}#loans tr.st-new{background:#dff3e9;background:color-mix(in srgb,#5bbf8e 30%,var(--surface))}#loans tr.st-repay{background:#fbe3df;background:color-mix(in srgb,#ef8a7d 30%,var(--surface))}#loans tr.st-wait{background:#fcefcf;background:color-mix(in srgb,#f2c46b 38%,var(--surface))}
.rep-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.rep{background:var(--soft);border-radius:14px;padding:12px 14px}.rep span{display:block;color:var(--muted);font-size:13px}.rep b{display:block;font-size:18px;line-height:1.6;overflow-wrap:anywhere}.rep b i{font-style:normal;font-size:12px;font-weight:400;color:var(--muted)}.rep small{color:var(--muted);font-size:12px}.rep.hi{background:var(--ok-soft)}.rep.hi b{color:var(--ok)}.rep.neg{background:var(--warn-soft)}.rep.neg b{color:var(--warn)}.rep-act{margin-top:14px}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.cal{border:1px solid var(--line);border-radius:14px;padding:12px}.cal.now{border-color:var(--accent);background:var(--accent-soft)}.cm{font-size:13px;color:var(--muted)}.cm em{font-style:normal;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:0 8px;font-size:11px;margin-inline-start:6px}.ct{font-weight:800;font-size:17px}.cs{font-size:12px;color:var(--muted)}.cturn{margin-top:6px;background:var(--gold-soft);color:var(--goldink);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}.cb{height:4px;border-radius:4px;background:var(--accent);margin-top:8px;opacity:.55}
.cal-total{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0;font-weight:700}.panel .controls{margin-bottom:6px}
@media(max-width:700px){.rep-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rep:last-child{grid-column:1/-1}.cal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:701px){#loans tr.grp-start td{border-top:24px solid var(--surface)}#loans tr.st-new td:first-child{box-shadow:inset -5px 0 0 #5bbf8e}#loans tr.st-repay td:first-child{box-shadow:inset -5px 0 0 #ef8a7d}#loans tr.st-wait td:first-child{box-shadow:inset -5px 0 0 #f2c46b}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadear{from{opacity:0}to{opacity:.14}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #15845e66}50%{box-shadow:0 0 0 8px #15845e00}}
main section:not(.hide){animation:rise .35s ease both}
.fill{transform-origin:right;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.lc,.ld{stroke-dasharray:1;animation:draw 1.6s ease both}.ar{animation:fadear 1.6s ease both}

function loanSchedule(item){
 let outstanding=item.march,activePrincipal=0,monthly=0;
 // Infer the original installment for the outstanding loan from Farvardin's scheduled installment.
 let first=item.events.find(v=>v>0&&v<10000000);
 if(outstanding>0&&first){monthly=first;activePrincipal=first*20;}
 let output=[];
 for(let idx=0;idx<loanCalendar.length;idx++){
   const value=idx<12?item.events[idx]:0;
   let installment=0,disbursed=0;
   if(value>=10000000){disbursed=value;outstanding+=value;activePrincipal=value;monthly=value/20;}
   else if(outstanding>0){
     // Within workbook months use explicit installment if available; blanks mean zero.
     // Beyond workbook horizon project the regular 20-month installment.
     installment=idx<12?Math.max(0,value):Math.min(outstanding,monthly);
     installment=Math.min(outstanding,installment);
     outstanding=Math.max(0,outstanding-installment);
   }
   output.push({balance:outstanding,installment,principal:activePrincipal,disbursed});
   if(outstanding===0){activePrincipal=0;monthly=0;}
 }
 return output;
}

function simulateConstant(start,cash,priorLoans,amount,horizon=HORIZON){
 let balance=cash,loans=priorLoans.slice(),minimum=Infinity;
 for(let k=0;k<horizon;k++){
  const idx=start+k;
  const base=idx<loanCalendar.length?sumsAt(idx).repayment:0;
  const newInstallments=loans.reduce((v,x)=>v+(idx>x.index&&idx<=x.index+20?x.amount/20:0),0);
  balance+=FEE_TOTAL+base+newInstallments-amount;
  minimum=Math.min(minimum,balance);
  loans.push({index:idx,amount});
 }
 return {ok:minimum>=-0.01,min:minimum};
}

  let proposed=level;
  while(proposed<300000000&&simulateConstant(i,runningCash,past,proposed+STEP).ok)proposed+=STEP;

  const base=sumsAt(i).repayment;

 const extraRepay=loans.reduce((v,x)=>v+(i>x.index&&i<=x.index+20?x.amount/20:0),0);
 return {debt:original.debt+extraDebt,repayment:original.repayment+extraRepay,disbursed:FORECAST[i-START_FUTURE]?.disbursed||0};
}

 const prefixes=PERSONAL_GROUPS[selectedPersonalName]||[];
 return LOAN_INPUTS.map((x,i)=>({name:x.name,index:i})).filter(x=>prefixes.some(prefix=>key(x.name).startsWith(key(prefix))));
}
function personalState(member,c){
 const base=LOAN_SCHEDULES[member.index][c];
 const future=FUTURE_LOANS.filter(x=>x.name===member.name&&x.index<=c);
 const extraBalance=future.reduce((s,x)=>s+Math.max(0,x.amount-(c-x.index)*x.amount/20),0);
 const extraInstallment=future.reduce((s,x)=>s+(c>x.index&&c<=x.index+20?x.amount/20:0),0);
 const activeFuture=future.filter(x=>c<=x.index+20).at(-1);
 return {balance:base.balance+extraBalance,installment:base.installment+extraInstallment,
  principal:activeFuture?.amount||base.principal,disbursed:base.disbursed+(future.find(x=>x.index===c)?.amount||0)};
}
function remainingInstallments(member,c,state){
 if(state.balance<=0)return 0;
 // For an active loan, count months from the selected month through its scheduled payoff.
 const activeFuture=FUTURE_LOANS.filter(x=>x.name===member.name&&x.index<=c&&c<x.index+20).at(-1);
 if(activeFuture)return Math.max(0,activeFuture.index+20-c);
 let count=0;
 for(let i=c+1;i<loanCalendar.length;i++){
  const row=LOAN_SCHEDULES[member.index][i];
  if(row.disbursed)break;
  if(row.installment>0)count++;
  if(row.balance===0)break;
 }
 return count;
}
function nextPersonalLoan(member,c){
 const next=loanCalendar.map((d,i)=>({d,i})).find(x=>x.i>c&&recipientByMonth.get(x.i)===member.name);
 if(!next)return null;
 return {label:next.d.label,amount:loanByMonth.get(next.i)||0,forecast:next.i>=12};
}
